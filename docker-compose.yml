# Belgrade OS — Hardened 3-Tier Compose
# Networks:
#   edge_net    — DMZ (internet-facing): cloudflared only
#   core_net    — internal: services that need Redis/DB/Docker proxy
#   compute_net — internal: AI inference workers
#
# Application services (gateway, bridge, etc.) require Dockerfiles
# and will be added as separate service definitions once built.

version: "3.9"

networks:
  edge_net:
    name: beg-os-edge
    driver: bridge
  core_net:
    name: beg-os-core
    driver: bridge
    internal: true
  compute_net:
    name: beg-os-compute
    driver: bridge
    internal: true

services:

  # ── Edge tier ─────────────────────────────────────────────────────────────

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: beg-os-tunnel
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - edge_net
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Core tier (internal) ──────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: beg-os-redis
    restart: always
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    command: >
      redis-server
      --aclfile /usr/local/etc/redis/users.acl
      --appendonly yes
      --rename-command CONFIG ""
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
    volumes:
      - ./data/redis:/data
      - ./config/redis.acl:/usr/local/etc/redis/users.acl:ro
    networks:
      - core_net
      - compute_net

  db:
    image: postgres:15-alpine
    container_name: beg-os-db
    restart: always
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/run/postgresql:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    environment:
      POSTGRES_USER: ${DB_USER:-laurent}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: belgrade_os
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - core_net

  # Tecnativa docker-socket-proxy: platform_controller uses this to manage
  # app containers instead of direct docker.sock access.
  # EXEC=0 prevents code execution in existing containers.
  # NETWORKS=0, VOLUMES=0 prevent creating network backdoors or deleting data volumes.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: beg-os-docker-proxy
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - core_net
