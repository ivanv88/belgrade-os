# Belgrade OS — Hardened 3-Tier Compose
# Networks:
#   edge_net    — DMZ (internet-facing): cloudflared only
#   core_net    — internal: services that need Redis/DB/Docker proxy
#   compute_net — internal: AI inference workers
#   host_net    — publishes Redis/Postgres on 127.0.0.1 for the services,
#                 which run as host processes (scripts/run-service.sh, systemd).
#                 Internal networks cannot publish ports, hence the extra network.

networks:
  edge_net:
    name: beg-os-edge
    driver: bridge
    # Pinned so mcp_server can listen on exactly this gateway (MCP_HOST=172.30.0.1):
    # reachable from the tunnel container, not from the LAN.
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  core_net:
    name: beg-os-core
    driver: bridge
    internal: true
  compute_net:
    name: beg-os-compute
    driver: bridge
    internal: true
  host_net:
    name: beg-os-host
    driver: bridge

# Named volumes, not bind mounts: redis/db run as fixed non-root uids (999/70)
# with read_only roots. Docker seeds a named volume with the image's ownership;
# a host bind-mount dir is owned by root or the host user and they can't write it.
volumes:
  redis_data:
    name: beg-os-redis-data
  pg_data:
    name: beg-os-pg-data

services:

  # ── Edge tier ─────────────────────────────────────────────────────────────

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: beg-os-tunnel
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    extra_hosts:
      # edge_net's gateway, where mcp_server listens — not host-gateway (docker0),
      # so the tunnel reaches only mcp_server, never the loopback-only services.
      - "host.docker.internal:172.30.0.1"
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      # `cloudflared tunnel ready` (healthcheck) queries the metrics server;
      # without a fixed address it fails with "--metrics has to be provided".
      - TUNNEL_METRICS=127.0.0.1:2000
    command: tunnel --no-autoupdate run
    networks:
      - edge_net
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Core tier (internal) ──────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: beg-os-redis
    restart: always
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    command: >
      redis-server
      --aclfile /usr/local/etc/redis/users.acl
      --appendonly yes
      --rename-command CONFIG ""
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
    volumes:
      - redis_data:/data
      - ./config/redis.acl:/usr/local/etc/redis/users.acl:ro
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - core_net
      - compute_net
      - host_net

  db:
    image: postgres:15-alpine
    container_name: beg-os-db
    restart: always
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /var/run/postgresql:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    environment:
      POSTGRES_USER: ${DB_USER:-laurent}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: belgrade_os
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Not 5432: the Lenovo runs native Postgres clusters there.
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    networks:
      - core_net
      - host_net

  # Tecnativa docker-socket-proxy: platform_controller uses this to manage
  # app containers instead of direct docker.sock access.
  # EXEC=0 prevents code execution in existing containers.
  # NETWORKS=0, VOLUMES=0 prevent creating network backdoors or deleting data volumes.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: beg-os-docker-proxy
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 32
    environment:
      CONTAINERS: 1
      POST: 1
      DELETE: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - core_net
