# Drop-in for belgrade-os@platform_controller.service.
# Apps register with the bridge once at startup and do not retry, so the
# controller (which spawns them) must not start before the bridge listens.
[Unit]
After=belgrade-os@bridge.service
Wants=belgrade-os@bridge.service

[Service]
# $$ escapes systemd's own variable expansion.
ExecStartPre=/bin/bash -c 'for i in $$(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null && exit 0; sleep 1; done; echo "bridge not listening on 8081" >&2; exit 1'
